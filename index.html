<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Loop</title>
    <!-- css -->
    <link rel="stylesheet" href="./styles.css" />
    <!-- favicon -->
    <link rel="shortcut icon" href="./images/music.png" type="image/x-icon" />
  </head>
  <body>
    <main>
      <section class="glass">
        <!-- # dashboard -->
        <div class="dashboard">
          <!-- user -->
          <article class="user">
            <img src="./images/profile.png" alt="logo" class="logo" />
            <div>
              <h3>Neshad</h3>
              <p>Compiling Caffeine into Code</p>
            </div>
          </article>

          <!-- links -->
          <article class="links">
            <a href="https:neshad.com">
              <div class="link">
                <img src="./images/web.png" alt="website" />
                <h3>Website</h3>
              </div>
            </a>

            <a href="https://www.instagram.com/neshadx">
              <div class="link">
                <img src="./images/instagram.png" alt="insta" />
                <h3>Instagram</h3>
              </div>
            </a>

            <a href="https://twitter.com/0xNeshad">
              <div class="link">
                <img src="./images/twitter.png" alt="twitter" />
                <h3>Twitter</h3>
              </div>
            </a>

            <a href="https://github.com/neshadx">
              <div class="link">
                <img src="./images/github.png" alt="github" />
                <h3>GitHub</h3>
              </div>
            </a>
          </article>

          <!-- Music -->
          <article class="music">
            🎧 <span class="np-key">const</span> song = "<span class="np-value"
              >Lo-Fi Beats</span
            >";
            <br />
            🎧 <span class="np-key">const</span> artist = "<span
              class="np-value"
              >ChillCode</span
            >";
          </article>
        </div>

        <div class="music-player">
          <!-- heading -->
          <h1>Enjoy the Vibes 🎵</h1>

          <!-- background music audio player -->
          <audio autoplay loop controls style="width: 100%; margin-top: 2rem">
            <source
              src="images/Jaden-Bye.mp3"
              type="audio/mpeg"
            />
            Your browser does not support the audio element.
          </audio>
        </div>
      </section>
    </main>

    <!-- Leaves -->
    <div class="leaves">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
    </div>
  </body>
</html>
